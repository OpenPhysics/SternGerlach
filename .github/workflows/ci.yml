name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * 1'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Caller must grant the scopes the reusable workflows request (CodeQL needs
# security-events: write, dependency-review needs pull-requests: write). The repo
# default token is read-only, so without this block reusable calls fail at startup.
permissions:
  contents: read
  actions: read
  security-events: write
  pull-requests: write

jobs:
  ci:
    uses: OpenPhysics/Baton/.github/workflows/ci.yml@main

  compliance:
    uses: OpenPhysics/Baton/.github/workflows/shared-compliance-check.yml@main

  dependency-review:
    if: github.event_name == 'pull_request'
    uses: OpenPhysics/Baton/.github/workflows/shared-dependency-review.yml@main

  codeql:
    uses: OpenPhysics/Baton/.github/workflows/shared-codeql.yml@main

  # The Playwright fuzz smoke needs a browser, so it runs here rather than in the shared
  # vitest job. It drives the built sim with the fuzz query parameters and fails on any
  # console error or assertion.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Fuzz the simulation
        run: npm run test:fuzz
        env:
          FUZZ_DURATION: 30

      - name: Upload fuzz report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-report
          path: playwright-report/
          retention-days: 7
